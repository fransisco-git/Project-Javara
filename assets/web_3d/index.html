<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JAVARA 3D Virtual Wardrobe Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #221711 0%, #150F0C 60%, #0A0706 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #DFB76C;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(223, 183, 108, 0.2);
      border-top-color: #DFB76C;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #studio-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(26, 20, 16, 0.75);
      border: 1px solid rgba(223, 183, 108, 0.35);
      border-radius: 20px;
      color: #E4C590;
      font-size: 11px;
      font-weight: 700;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
    }
  </style>
  <!-- Three.js r128 CDN via script tag -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <span id="loader-text">Memuat Studio Busana 3D...</span>
  </div>

  <div id="studio-badge">
    <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ADE80;"></span>
    <span>Three.js PBR Studio</span>
  </div>

  <canvas id="canvas3d"></canvas>

  <script>
    // =========================================================================
    // JAVARA THREE.JS 3D VIRTUAL WARDROBE ENGINE
    // =========================================================================

    let scene, camera, renderer;
    let avatarGroup, stageTurntable;
    let upperGarmentMesh, lowerGarmentMesh, headwearMesh, accessoryMesh;
    let clock;
    let isDragging = false;
    let previousPointerPosition = { x: 0, y: 0 };
    let currentGender = 'pria';
    let isAutoRotating = false;
    let breathingTime = 0;

    // Palet Warna & Tekstur PBR Busana Adat Jawa Tengah
    const PALET = {
      skinMale: 0xD2A679,
      skinFemale: 0xE2BA90,
      beskapBlack: 0x1A1412,
      kebayaGold: 0x9B2226,
      jarikParangSoga: 0x5C381E,
      blangkonSoga: 0x4A2E19,
      goldAccent: 0xDFB76C,
      silverAccent: 0xD1D5DB,
      woodFloor: 0x1E1510
    };

    function notifyFlutter(type, data = {}) {
      const payload = JSON.stringify({ type, data });
      try {
        if (window.FlutterChannel) {
          window.FlutterChannel.postMessage(payload);
        } else if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('FlutterChannel', payload);
        }
      } catch (err) {
        console.log('Bridge to Flutter message:', payload);
      }
    }

    function init() {
      clock = new THREE.Clock();
      const canvas = document.getElementById('canvas3d');

      // 1. Scene
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0E0B09, 0.035);

      // 2. Camera
      camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.45, 3.8);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      // 4. Pencahayaan Studio Editorial (Key, Fill, Rim Light)
      setupLighting();

      // 5. Panggung Turntable Keraton
      setupStage();

      // 6. Buat Avatar Manusia Realistis & Busana Awal
      avatarGroup = new THREE.Group();
      scene.add(avatarGroup);
      buildRealisticAvatar(currentGender);

      // 7. Event Listeners (Touch & Orbit)
      setupControls(canvas);

      // Sembunyikan Loader
      setTimeout(() => {
        const loader = document.getElementById('loader');
        if (loader) loader.style.opacity = '0';
        notifyFlutter('sceneReady', { gender: currentGender });
      }, 500);

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    function setupLighting() {
      // Ambient warm
      const ambientLight = new THREE.AmbientLight(0xFAF0E6, 0.85);
      scene.add(ambientLight);

      // Key light (Golden warm spotlight from top-left)
      const keyLight = new THREE.SpotLight(0xFFE8C2, 2.8, 12, Math.PI / 4, 0.4, 1);
      keyLight.position.set(2.2, 4.5, 3.2);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 1024;
      keyLight.shadow.mapSize.height = 1024;
      keyLight.shadow.bias = -0.0005;
      scene.add(keyLight);

      // Rim light (Backlight creating rim highlights on silk & velvet fabrics)
      const rimLight = new THREE.DirectionalLight(0xDFB76C, 1.6);
      rimLight.position.set(-2.5, 3.2, -2.5);
      scene.add(rimLight);

      // Fill soft blue-gray shadow light
      const fillLight = new THREE.DirectionalLight(0x6B7280, 0.5);
      fillLight.position.set(0, -1, 3);
      scene.add(fillLight);
    }

    function setupStage() {
      stageTurntable = new THREE.Group();
      scene.add(stageTurntable);

      // Lantai Panggung Kayu Jati Keraton
      const floorGeo = new THREE.CylinderGeometry(1.6, 1.65, 0.12, 48);
      const floorMat = new THREE.MeshStandardMaterial({
        color: PALET.woodFloor,
        roughness: 0.35,
        metalness: 0.15
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.position.y = -0.06;
      floor.receiveShadow = true;
      stageTurntable.add(floor);

      // Cincin Emas Ornamen Panggung
      const ringGeo = new THREE.TorusGeometry(1.58, 0.02, 16, 64);
      const ringMat = new THREE.MeshStandardMaterial({
        color: PALET.goldAccent,
        roughness: 0.2,
        metalness: 0.85
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.01;
      stageTurntable.add(ring);
    }

    // =========================================================================
    // PEMBUATAN AVATAR MANUSIA REALISTIS BERBASIS THREE.JS PBR
    // =========================================================================
    function buildRealisticAvatar(gender) {
      while(avatarGroup.children.length > 0) {
        avatarGroup.remove(avatarGroup.children[0]);
      }

      const isMale = gender === 'pria';
      const skinColor = isMale ? PALET.skinMale : PALET.skinFemale;

      const skinMat = new THREE.MeshStandardMaterial({
        color: skinColor,
        roughness: 0.65,
        metalness: 0.05
      });

      // 1. Torso / Badan Utama
      const torsoGeo = new THREE.CylinderGeometry(
        isMale ? 0.26 : 0.21,
        isMale ? 0.21 : 0.24,
        0.65,
        24
      );
      const torso = new THREE.Mesh(torsoGeo, skinMat);
      torso.position.y = 1.35;
      torso.castShadow = true;
      avatarGroup.add(torso);

      // 2. Leher & Kepala Realistis
      const neckGeo = new THREE.CylinderGeometry(0.08, 0.09, 0.14, 16);
      const neck = new THREE.Mesh(neckGeo, skinMat);
      neck.position.y = 1.74;
      avatarGroup.add(neck);

      const headGeo = new THREE.SphereGeometry(0.14, 24, 24);
      headGeo.scale(1.0, 1.25, 1.1);
      const head = new THREE.Mesh(headGeo, skinMat);
      head.position.y = 1.92;
      head.castShadow = true;
      avatarGroup.add(head);

      // 3. Lengan & Tangan Santun
      const armGeo = new THREE.CylinderGeometry(0.065, 0.055, 0.62, 16);
      const leftArm = new THREE.Mesh(armGeo, skinMat);
      leftArm.position.set(-0.32, 1.32, 0.05);
      leftArm.rotation.z = 0.12;
      leftArm.rotation.x = 0.15;
      avatarGroup.add(leftArm);

      const rightArm = new THREE.Mesh(armGeo, skinMat);
      rightArm.position.set(0.32, 1.32, 0.05);
      rightArm.rotation.z = -0.12;
      rightArm.rotation.x = 0.15;
      avatarGroup.add(rightArm);

      // 4. Kaki Penopang
      const legGeo = new THREE.CylinderGeometry(0.09, 0.075, 0.95, 16);
      const leftLeg = new THREE.Mesh(legGeo, skinMat);
      leftLeg.position.set(-0.11, 0.48, 0);
      avatarGroup.add(leftLeg);

      const rightLeg = new THREE.Mesh(legGeo, skinMat);
      rightLeg.position.set(0.11, 0.48, 0);
      avatarGroup.add(rightLeg);

      // Pasang Busana Adat Awal Sesuai Gender
      loadDefaultOutfit(gender);
    }

    function loadDefaultOutfit(gender) {
      if (gender === 'pria') {
        setHeadwear('blangkon_solo');
        setUpperClothing('beskap_solo');
        setLowerClothing('jarik_parang');
        setAccessory('keris_solo');
      } else {
        setHeadwear('sanggul_solo');
        setUpperClothing('kebaya_kartini');
        setLowerClothing('jarik_sidoasih');
        setAccessory('selendang_solo');
      }
    }

    // =========================================================================
    // SISTEM MODULAR BUSANA ADAT TIGA DIMENSI (THREE.JS MODULAR WARDROBE)
    // =========================================================================

    // Headwear: Blangkon / Sanggul
    function setHeadwear(type) {
      if (headwearMesh) avatarGroup.remove(headwearMesh);

      headwearMesh = new THREE.Group();
      if (type.includes('blangkon')) {
        // Lingkar Blangkon Kasunanan Solo
        const blangkonGeo = new THREE.SphereGeometry(0.155, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.65);
        const blangkonMat = new THREE.MeshStandardMaterial({
          color: PALET.blangkonSoga,
          roughness: 0.75,
          metalness: 0.08
        });
        const dome = new THREE.Mesh(blangkonGeo, blangkonMat);
        dome.position.y = 1.95;
        headwearMesh.add(dome);

        // Mondholan Belakang (Khas Surakarta Trepes / Mangkunegaran)
        const mondholanGeo = new THREE.SphereGeometry(0.045, 16, 16);
        mondholanGeo.scale(1.2, 0.8, 0.6);
        const mondholan = new THREE.Mesh(mondholanGeo, blangkonMat);
        mondholan.position.set(0, 1.91, -0.15);
        headwearMesh.add(mondholan);
      } else {
        // Sanggul Klasik Solo & Cunduk Mentul
        const sanggulGeo = new THREE.SphereGeometry(0.085, 20, 20);
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x110D0A, roughness: 0.8 });
        const sanggul = new THREE.Mesh(sanggulGeo, hairMat);
        sanggul.position.set(0, 1.95, -0.16);
        headwearMesh.add(sanggul);

        // Cunduk Mentul Emas
        const pinMat = new THREE.MeshStandardMaterial({ color: PALET.goldAccent, roughness: 0.2, metalness: 0.9 });
        for (let i = -2; i <= 2; i++) {
          const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.12), pinMat);
          pin.position.set(i * 0.04, 2.12, 0);
          pin.rotation.z = -i * 0.12;
          headwearMesh.add(pin);
        }
      }

      avatarGroup.add(headwearMesh);
      notifyFlutter('outfitChanged', { slot: 'headwear', item: type });
    }

    // Upper Garment: Beskap / Kebaya
    function setUpperClothing(type) {
      if (upperGarmentMesh) avatarGroup.remove(upperGarmentMesh);

      upperGarmentMesh = new THREE.Group();
      if (type.includes('beskap')) {
        // Beskap Landhung Hitam Kasunanan
        const beskapGeo = new THREE.CylinderGeometry(0.28, 0.24, 0.72, 24);
        const beskapMat = new THREE.MeshStandardMaterial({
          color: PALET.beskapBlack,
          roughness: 0.7,
          metalness: 0.12
        });
        const body = new THREE.Mesh(beskapGeo, beskapMat);
        body.position.y = 1.34;
        body.castShadow = true;
        upperGarmentMesh.add(body);

        // Kancing Emas Berbaris
        const btnMat = new THREE.MeshStandardMaterial({ color: PALET.goldAccent, metalness: 0.9, roughness: 0.15 });
        for (let i = 0; i < 5; i++) {
          const btn = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 12), btnMat);
          btn.position.set(0, 1.58 - i * 0.08, 0.27);
          upperGarmentMesh.add(btn);
        }
      } else {
        // Kebaya Bludru Kasunanan / Kartini
        const kebayaGeo = new THREE.CylinderGeometry(0.23, 0.26, 0.68, 24);
        const kebayaMat = new THREE.MeshStandardMaterial({
          color: PALET.kebayaGold,
          roughness: 0.55,
          metalness: 0.25
        });
        const body = new THREE.Mesh(kebayaGeo, kebayaMat);
        body.position.y = 1.34;
        body.castShadow = true;
        upperGarmentMesh.add(body);

        // Renda Emas Bordir Tepi
        const laceMat = new THREE.MeshStandardMaterial({ color: PALET.goldAccent, metalness: 0.85, roughness: 0.3 });
        const lace = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.65, 0.02), laceMat);
        lace.position.set(0, 1.34, 0.24);
        upperGarmentMesh.add(lace);
      }

      avatarGroup.add(upperGarmentMesh);
      notifyFlutter('outfitChanged', { slot: 'upper', item: type });
    }

    // Lower Garment: Jarik Batik Wiru
    function setLowerClothing(type) {
      if (lowerGarmentMesh) avatarGroup.remove(lowerGarmentMesh);

      lowerGarmentMesh = new THREE.Group();
      // Jarik Batik Lipatan Wiru Solo
      const jarikGeo = new THREE.CylinderGeometry(0.23, 0.28, 0.98, 24);
      const jarikMat = new THREE.MeshStandardMaterial({
        color: PALET.jarikParangSoga,
        roughness: 0.8,
        metalness: 0.05
      });
      const jarik = new THREE.Mesh(jarikGeo, jarikMat);
      jarik.position.y = 0.52;
      jarik.castShadow = true;
      lowerGarmentMesh.add(jarik);

      // Lipatan Wiru Depan Khas Surakarta
      const wiruMat = new THREE.MeshStandardMaterial({ color: 0x3E2412, roughness: 0.82 });
      for (let i = 0; i < 4; i++) {
        const fold = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.94, 0.015), wiruMat);
        fold.position.set(-0.04 + i * 0.025, 0.52, 0.26);
        lowerGarmentMesh.add(fold);
      }

      avatarGroup.add(lowerGarmentMesh);
      notifyFlutter('outfitChanged', { slot: 'lower', item: type });
    }

    // Accessory: Keris / Selendang
    function setAccessory(type) {
      if (accessoryMesh) avatarGroup.remove(accessoryMesh);

      accessoryMesh = new THREE.Group();
      if (type.includes('keris')) {
        // Keris Warangka Ladrang Surakarta (Diselipkan di Punggung Belakang)
        const kerisMat = new THREE.MeshStandardMaterial({ color: PALET.goldAccent, metalness: 0.85, roughness: 0.25 });
        const blade = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.005, 0.52), kerisMat);
        blade.position.set(0.05, 1.15, -0.25);
        blade.rotation.z = -0.35;
        blade.rotation.x = -0.2;
        accessoryMesh.add(blade);

        // Warangka
        const warangka = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.04, 0.03), kerisMat);
        warangka.position.set(0.03, 1.35, -0.24);
        warangka.rotation.z = -0.35;
        accessoryMesh.add(warangka);
      } else {
        // Selendang Sutra Melingkar di Pundak
        const shawlMat = new THREE.MeshStandardMaterial({ color: 0xFFDF9E, roughness: 0.45, metalness: 0.2 });
        const shawl = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.03, 12, 32), shawlMat);
        shawl.position.set(0, 1.38, 0.02);
        shawl.rotation.x = Math.PI / 2.2;
        accessoryMesh.add(shawl);
      }

      avatarGroup.add(accessoryMesh);
      notifyFlutter('outfitChanged', { slot: 'accessory', item: type });
    }

    // =========================================================================
    // INTERAKSI SENTUHAN 360 DERAJAT (ORBIT & ROTATION CONTROLS)
    // =========================================================================
    function setupControls(canvas) {
      let touchStartX = 0;
      let touchStartY = 0;

      canvas.addEventListener('pointerdown', (e) => {
        isDragging = true;
        previousPointerPosition = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousPointerPosition.x;
        const deltaY = e.clientY - previousPointerPosition.y;

        // Rotasi Azimuth 360° Horizontal
        if (avatarGroup) {
          avatarGroup.rotation.y += deltaX * 0.012;
        }

        // Elevasi Kamera Vertikal Dibatasi
        camera.position.y = Math.max(0.6, Math.min(2.4, camera.position.y - deltaY * 0.004));
        camera.lookAt(0, 1.25, 0);

        previousPointerPosition = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('pointerup', () => { isDragging = false; });
      window.addEventListener('pointercancel', () => { isDragging = false; });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // =========================================================================
    // LOOP ANIMASI ALAMI (BREATHING & NATURAL MOVEMENT)
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      breathingTime += delta * 1.5;

      // Animasi Nafas Alami Dada (Natural Idle Breathing)
      if (avatarGroup && !isDragging) {
        const breathingScale = 1.0 + Math.sin(breathingTime) * 0.008;
        avatarGroup.scale.set(1.0, breathingScale, 1.0);

        // Slow auto rotation jika diaktifkan
        if (isAutoRotating) {
          avatarGroup.rotation.y += 0.005;
        }
      }

      renderer.render(scene, camera);
    }

    // =========================================================================
    // FLUTTER JAVASCRIPT BRIDGE CONTRACT
    // =========================================================================
    window.ThreeJsBridge = {
      initializeScene: function(gender) {
        currentGender = gender || 'pria';
        buildRealisticAvatar(currentGender);
        notifyFlutter('avatarSelected', { gender: currentGender });
      },
      changeOutfit: function(presetId) {
        if (presetId.includes('beskap') || presetId.includes('pria')) {
          setUpperClothing('beskap_solo');
          setHeadwear('blangkon_solo');
          setLowerClothing('jarik_parang');
          setAccessory('keris_solo');
        } else {
          setUpperClothing('kebaya_kartini');
          setHeadwear('sanggul_solo');
          setLowerClothing('jarik_sidoasih');
          setAccessory('selendang_solo');
        }
      },
      changeUpperClothing: function(id) { setUpperClothing(id); },
      changeLowerClothing: function(id) { setLowerClothing(id); },
      changeHeadwear: function(id) { setHeadwear(id); },
      addAccessory: function(id) { setAccessory(id); },
      rotateAvatar: function(radians) {
        if (avatarGroup) avatarGroup.rotation.y = radians;
      },
      resetCamera: function() {
        camera.position.set(0, 1.45, 3.8);
        camera.lookAt(0, 1.25, 0);
        if (avatarGroup) avatarGroup.rotation.y = 0;
      },
      toggleAutoRotate: function() {
        isAutoRotating = !isAutoRotating;
        return isAutoRotating;
      }
    };

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
